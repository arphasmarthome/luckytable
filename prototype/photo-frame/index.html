<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LUMIQ 家庭相框原型，支援照片 AI 動態自動播放與家庭裝置同步。"
    />
    <title data-i18n="LUMIQ 家庭相框">LUMIQ 家庭相框</title>
    <link rel="stylesheet" href="styles.css?v=ai-motion-4" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff8b4a" />
          <stop offset="55%" stop-color="#ea526f" />
          <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <symbol id="i-sparkles" viewBox="0 0 24 24">
          <path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3Z" />
          <path d="m19 14 .8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14Z" />
          <path d="m5 3 .7 2.3L8 6l-2.3.7L5 9l-.7-2.3L2 6l2.3-.7L5 3Z" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8" /><path d="M5 10v11h14V10M9 21v-7h6v7" /></symbol>
        <symbol id="i-utensils" viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 3 3V3M6 7h3M9 14v7" /><path d="M15 3v18M15 3c3 0 5 2 5 5v5h-5" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></symbol>
        <symbol id="i-images" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 8.6 4.7 4.7 0 0 0 7 18Z" /><path d="m9.5 14 1.7 1.7 3.8-4" /></symbol>
        <symbol id="i-weather-cloud" viewBox="0 0 24 24"><path d="M6.5 19h10.8a4.2 4.2 0 0 0 .3-8.4A6.2 6.2 0 0 0 5.8 9.1 5 5 0 0 0 6.5 19Z" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></symbol>
        <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6.5 15h11a3.8 3.8 0 0 0 .2-7.6A5.8 5.8 0 0 0 6.4 6.2 4.4 4.4 0 0 0 6.5 15Z" /><path d="m8 18-1 2M13 18l-1 2M18 18l-1 2" /></symbol>
        <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M4 7l16 10M4 17 20 7M8.5 4.5 12 7l3.5-2.5M8.5 19.5 12 17l3.5 2.5M4.5 11 8 12.5 7.5 16M19.5 13 16 11.5l.5-3.5" /></symbol>
        <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.6a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M2 9a15 15 0 0 1 20 0" /></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5" /><path d="M5 14v6h14v-6" /></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8Z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
        <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5" /></symbol>
        <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
        <symbol id="i-wand" viewBox="0 0 24 24"><path d="m15 4 5 5L7 22l-5-5Z" /><path d="m13 6 5 5M6 3v4M4 5h4M19 16v5M16.5 18.5h5" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5" /></symbol>
        <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 17h.01" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></symbol>
      </defs>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主要導覽" data-i18n-aria="主要導覽">
        <button class="sidebar-mark" type="button" data-nav="首頁" aria-label="LUMIQ 首頁" data-i18n-aria="LUMIQ 首頁">
          <svg aria-hidden="true"><use href="#i-sparkles"></use></svg>
        </button>
        <nav class="sidebar-nav">
          <button class="nav-item" type="button" data-nav="首頁"><svg aria-hidden="true"><use href="#i-home"></use></svg><span data-i18n="首頁">首頁</span></button>
          <button class="nav-item" type="button" data-nav="食譜"><svg aria-hidden="true"><use href="#i-utensils"></use></svg><span data-i18n="食譜">食譜</span></button>
          <button class="nav-item" type="button" data-nav="健康"><svg aria-hidden="true"><use href="#i-heart"></use></svg><span data-i18n="健康">健康</span></button>
          <button class="nav-item" type="button" data-nav="行事曆"><svg aria-hidden="true"><use href="#i-calendar"></use></svg><span data-i18n="行事曆">行事曆</span></button>
          <button class="nav-item" type="button" data-nav="家庭"><svg aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="家庭">家庭</span></button>
          <button class="nav-item is-active" type="button" data-nav="相框" aria-current="page"><svg aria-hidden="true"><use href="#i-images"></use></svg><span data-i18n="相框">相框</span></button>
          <button class="nav-item" type="button" data-nav="設定"><svg aria-hidden="true"><use href="#i-settings"></use></svg><span data-i18n="設定">設定</span></button>
        </nav>
      </aside>

      <header class="topbar">
        <button class="brand-lockup" type="button" data-nav="首頁" aria-label="回到首頁" data-i18n-aria="回到首頁">
          <span class="brand-name">LUMI<span>Q</span><i></i></span>
          <span class="brand-subtitle">STUDIO</span>
        </button>
        <div class="home-context"><span data-i18n="阿發之家・家庭中控">阿發之家・家庭中控</span><time id="currentTime" datetime="15:58">15:58</time></div>
        <div class="weather"><svg aria-hidden="true"><use href="#i-wifi"></use></svg><span data-i18n="臺北市・28° 多雲">臺北市・28° 多雲</span></div>
        <div class="topbar-actions">
          <button class="sync-state" type="button" id="headerSync"><svg aria-hidden="true"><use href="#i-cloud"></use></svg><span data-i18n="雲端連線正常">雲端連線正常</span></button>
          <button class="icon-button account-button" type="button" data-nav="個人帳號" aria-label="個人帳號" data-i18n-aria="個人帳號"><svg aria-hidden="true"><use href="#i-user"></use></svg></button>
        </div>
      </header>

      <main class="workspace" id="appMain" tabindex="-1">
        <section class="frame-page">
          <header class="page-heading">
            <div>
              <p class="eyebrow">FAMILY MEMORIES</p>
              <h1 data-i18n="家裡最近的好時刻。">家裡最近的好時刻。</h1>
              <p class="page-status" id="pageStatus" aria-live="polite"></p>
            </div>
          </header>

          <div class="frame-layout">
            <section class="viewer" aria-label="家庭相框預覽" data-i18n-aria="家庭相框預覽">
              <div class="photo-stage" id="photoStage"></div>
              <div class="viewer-toolbar" id="viewerToolbar"></div>
            </section>
          </div>

        </section>
      </main>
    </div>

    <dialog class="ai-dialog" id="aiDialog" aria-labelledby="aiDialogTitle">
      <div class="dialog-shell">
        <header class="dialog-heading">
          <div><p class="eyebrow">AI MOTION PHOTO</p><h2 id="aiDialogTitle" data-i18n="AI 美化照片">AI 美化照片</h2></div>
          <button class="icon-button quiet" type="button" data-ai-action="close" aria-label="關閉 AI 美化" data-i18n-aria="關閉 AI 美化"><svg aria-hidden="true"><use href="#i-x"></use></svg></button>
        </header>
        <div id="aiDialogBody"></div>
      </div>
    </dialog>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsDialogTitle">
      <div class="dialog-shell">
        <header class="dialog-heading">
          <div><p class="eyebrow">PHOTO FRAME</p><h2 id="settingsDialogTitle" data-i18n="相框設定">相框設定</h2></div>
          <button class="icon-button quiet" type="button" data-settings-action="close" aria-label="關閉相框設定" data-i18n-aria="關閉相框設定"><svg aria-hidden="true"><use href="#i-x"></use></svg></button>
        </header>
        <div id="settingsDialogBody"></div>
        <input id="photoInput" type="file" accept="image/*" hidden />
      </div>
    </dialog>

    <dialog class="confirm-dialog" id="removeDialog" aria-labelledby="removeDialogTitle">
      <form method="dialog">
        <span class="danger-icon"><svg aria-hidden="true"><use href="#i-trash"></use></svg></span>
        <h2 id="removeDialogTitle" data-i18n="移除這張照片？">移除這張照片？</h2>
        <p data-i18n="原圖與產生的動態版本都會從這台裝置移除。">原圖與產生的動態版本都會從這台裝置移除。</p>
        <div><button class="secondary-button" value="cancel" data-i18n="取消">取消</button><button class="danger-button" value="confirm" data-i18n="移除照片">移除照片</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="../device/i18n.js"></script>
    <script src="../device/i18n.en.js"></script>
    <script src="../device/i18n.de.js"></script>
    <script src="../device/i18n.es.js"></script>
    <script src="app.js?v=i18n-1"></script>
    <script src="../device/embed-bridge.js"></script>
  </body>
</html>
